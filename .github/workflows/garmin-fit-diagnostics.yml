name: Garmin FIT capability diagnostics

on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "Garmin activity ID to inspect (read-only)"
        required: true
        default: "23318941398"

permissions:
  contents: read

concurrency:
  group: garmin-fit-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated Garmin and FIT clients
        run: python -m pip install garmin-connect-personal-api-python fitparse==1.2.0

      - name: Download one activity and inspect FIT structure
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          ACTIVITY_ID: ${{ inputs.activity_id }}
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from datetime import datetime
          from io import BytesIO
          from pathlib import Path
          import os
          import re
          import subprocess
          import tempfile
          import zipfile

          from fitparse import FitFile

          activity_id = os.environ["ACTIVITY_ID"]
          if not re.fullmatch(r"[0-9]{5,20}", activity_id):
              raise ValueError("activity_id must be numeric")
          if not os.environ.get("GARMIN_PERSONAL_API_KEY"):
              raise RuntimeError("Garmin API key is missing")

          with tempfile.TemporaryDirectory(prefix="garmin-fit-probe-") as tmp:
              directory = Path(tmp)
              output = directory / "activity_export"
              command = [
                  "gc-personal", "--quiet", "activity-download",
                  "-o", str(output), activity_id
              ]
              result = subprocess.run(
                  command, cwd=directory, capture_output=True,
                  text=True, timeout=120, check=False
              )
              print("Download command succeeded:", result.returncode == 0)
              if result.returncode != 0:
                  # Never echo raw CLI stderr/stdout (may contain sensitive data).
                  raise RuntimeError("Garmin activity download failed; output suppressed")

              files = [
                  p for p in directory.rglob("*")
                  if p.is_file() and not p.is_symlink()
              ]
              print("Downloaded file count:", len(files))
              if not files:
                  raise RuntimeError("Download returned no files")

              fit_bytes = []
              max_size = 100 * 1024 * 1024
              for path in files:
                  if path.stat().st_size > max_size:
                      raise RuntimeError("Export exceeds diagnostic size limit")
                  data = path.read_bytes()
                  if zipfile.is_zipfile(BytesIO(data)):
                      with zipfile.ZipFile(BytesIO(data)) as archive:
                          for info in archive.infolist():
                              if info.is_dir() or not info.filename.lower().endswith(".fit"):
                                  continue
                              if info.file_size > max_size:
                                  raise RuntimeError("FIT member exceeds size limit")
                              fit_bytes.append(archive.read(info))
                  elif len(data) >= 12 and data[8:12] == b".FIT":
                      fit_bytes.append(data)

              print("FIT files detected:", len(fit_bytes))
              if not fit_bytes:
                  raise RuntimeError("No FIT data found in Garmin export")

              for file_number, data in enumerate(fit_bytes, 1):
                  counts = Counter()
                  fields = defaultdict(set)
                  first_timestamps = {}
                  # In-memory parsing only; no FIT file or records are uploaded.
                  for message in FitFile(BytesIO(data)).get_messages():
                      name = message.name
                      counts[name] += 1
                      if name in ("lap", "record", "session", "event",
                                  "activity", "sport", "zones_target"):
                          for field in message:
                              if field.name:
                                  fields[name].add(field.name)
                              if (field.name == "timestamp"
                                      and isinstance(field.value, datetime)
                                      and name not in first_timestamps):
                                  first_timestamps[name] = field.value.isoformat()

                  print(f"FIT file {file_number}: message counts:",
                        dict(sorted(counts.items())))
                  for name in ("lap", "record", "session", "event",
                               "activity", "sport", "zones_target"):
                      print(f"FIT file {file_number} {name} fields:",
                            sorted(fields[name]))
                      if name in first_timestamps:
                          print(f"FIT file {file_number} {name} first timestamp:",
                                first_timestamps[name])

              print("Read-only FIT diagnostics completed")
          PY
