
name: Test Garmin API

on:
  workflow_dispatch:

jobs:
  garmin-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: pip install garmin-connect-personal-api-python

      - name: Verify Garmin connection
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          gc-personal --quiet profile-settings > /dev/null
          echo "Garmin API connection OK"


      
      
     
      - name: Sync Garmin activities to Google Sheets
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GOOGLE_SYNC_TOKEN: ${{ secrets.GOOGLE_SYNC_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timedelta

          end = datetime.now().date()
          start = end - timedelta(days=30)

          result = subprocess.run(
              [
                  "gc-personal", "--quiet", "activities",
                  "--start-date", start.isoformat(),
                  "--end-date", end.isoformat(),
                  "--limit", "200"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          raw = json.loads(result.stdout)

          if not isinstance(raw, list):
              raise RuntimeError("Unexpected Garmin response")

          def number(value, divisor=1):
              if value is None:
                  return None
              return round(float(value) / divisor, 3)

          def sport_name(value):
              if isinstance(value, dict):
                  return (
                      value.get("typeKey")
                      or value.get("typeId")
                      or "unknown"
                  )
              return str(value or "unknown")

          activities = []

          for a in raw:
              distance = a.get("distance")
              duration = a.get("duration")
              speed = a.get("averageSpeed")

              pace = None
              if distance and duration:
                  pace = round(
                      float(duration) / (float(distance) / 1000),
                      1
                  )

              activity_id = a.get("activityId")
              if activity_id is None:
                  continue

              activities.append({
                  "activity_id": str(activity_id),
                  "date": a.get("startTimeLocal"),
                  "sport": sport_name(a.get("activityType")),
                  "name": a.get("activityName"),
                  "duration_sec": number(duration),
                  "distance_km": number(distance, 1000),
                  "pace_sec_km": pace,
                  "speed_kmh": number(speed, 1 / 3.6),
                  "avg_hr": a.get("averageHR"),
                  "max_hr": a.get("maxHR"),
                  "avg_power": a.get("avgPower"),
                  "np": a.get("normPower"),
                  "cadence": (
                      a.get("averageRunningCadenceInStepsPerMinute")
                      or a.get("averageBikingCadenceInRevPerMinute")
                      or a.get("averageSwimCadenceInStrokesPerMinute")
                  ),
                  "elevation_m": a.get("elevationGain"),
                  "calories": a.get("calories"),
                  "aerobic_te": a.get("aerobicTrainingEffect"),
                  "anaerobic_te": a.get("anaerobicTrainingEffect"),
                  "training_load": a.get("activityTrainingLoad"),
                  "url": (
                      "https://connect.garmin.com/modern/activity/"
                      + str(activity_id)
                  )
              })

          payload = json.dumps({
              "token": os.environ["GOOGLE_SYNC_TOKEN"],
              "activities": activities
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["GOOGLE_SCRIPT_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.loads(response.read().decode("utf-8"))

          if data.get("ok") is not True:
              raise RuntimeError(
                  "Google Sheets sync failed: "
                  + str(data.get("error", "Unknown error"))
              )

          print("Garmin activities fetched:", len(activities))
          print("Activities added to Google Sheets:", data.get("added"))
          PY




      - name: Test Google Sheets connection
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GOOGLE_SYNC_TOKEN: ${{ secrets.GOOGLE_SYNC_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          token = os.environ["GOOGLE_SYNC_TOKEN"]

          payload = json.dumps({
              "token": token,
              "activities": []
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if result.get("ok") is not True:
              raise RuntimeError(
                  "Google Sheets connection failed: "
                  + str(result.get("error", "Unknown error"))
              )

          print("Google Sheets connection OK")
          print("Activities added:", result.get("added"))
          PY





