
name: Test Garmin API

on:
  workflow_dispatch:

jobs:
  garmin-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: pip install garmin-connect-personal-api-python

      - name: Verify Garmin connection
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          gc-personal --quiet profile-settings > /dev/null
          echo "Garmin API connection OK"


      
      
      - name: Inspect Garmin activities
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["gc-personal", "--quiet", "activities", "--limit", "3"],
              capture_output=True,
              text=True,
              check=True
          )

          activities = json.loads(result.stdout)

          print("Response type:", type(activities).__name__)

          if isinstance(activities, dict):
              print("Top-level keys:", list(activities.keys()))
              for key in ("activities", "data", "results"):
                  if isinstance(activities.get(key), list):
                      activities = activities[key]
                      break

          if isinstance(activities, list):
              print("Activities found:", len(activities))
              for activity in activities:
                  if isinstance(activity, dict):
                      print("Activity fields:", sorted(activity.keys()))
          PY



      - name: Test Google Sheets connection
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GOOGLE_SYNC_TOKEN: ${{ secrets.GOOGLE_SYNC_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["GOOGLE_SCRIPT_URL"]
          token = os.environ["GOOGLE_SYNC_TOKEN"]

          payload = json.dumps({
              "token": token,
              "activities": []
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          if result.get("ok") is not True:
              raise RuntimeError(
                  "Google Sheets connection failed: "
                  + str(result.get("error", "Unknown error"))
              )

          print("Google Sheets connection OK")
          print("Activities added:", result.get("added"))
          PY





