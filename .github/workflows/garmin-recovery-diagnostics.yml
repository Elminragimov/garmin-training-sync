name: Inspect Garmin recovery commands
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Garmin client
        run: pip install garmin-connect-personal-api-python
      - name: Inspect recovery nested field schemas
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import date, timedelta

          day = (date.today() - timedelta(days=1)).isoformat()
          def get(command):
              proc = subprocess.run(
                  ["gc-personal", "--quiet", command,
                   "--start-date", day, "--end-date", day],
                  capture_output=True, text=True, timeout=90, check=True
              )
              return json.loads(proc.stdout)

          def schema(label, value):
              if isinstance(value, dict):
                  print(label, "object keys:", sorted(value.keys()))
                  for k, v in value.items():
                      print(label + "." + k, "type:", type(v).__name__)
                      if isinstance(v, dict):
                          print(label + "." + k, "nested keys:", sorted(v.keys()))
              elif isinstance(value, list):
                  print(label, "list length:", len(value))
                  if value:
                      print(label, "first element type:", type(value[0]).__name__)
                      if isinstance(value[0], dict):
                          print(label, "first element keys:", sorted(value[0].keys()))
                      elif isinstance(value[0], list):
                          print(label, "first element length:", len(value[0]))
                          print(label, "first element types:", [type(v).__name__ for v in value[0]])
              else:
                  print(label, "type:", type(value).__name__)

          sleep = get("sleep-summaries")
          if sleep: schema("sleepScores", sleep[0].get("sleepScores"))
          daily = get("daily-summaries").get("data", [])
          if daily:
              for key in ("heartRate", "stress", "bodyBattery"):
                  schema("daily." + key, daily[0].get(key))
          battery = get("body-battery")
          if battery:
              schema("battery.values", battery[0].get("bodyBatteryValuesArray"))
          PY
