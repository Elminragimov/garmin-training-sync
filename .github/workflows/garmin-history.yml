
name: Garmin Full History Import

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: "Start from activity number (0 for first run)"
        required: true
        default: "0"
      max_pages:
        description: "Number of pages to import (100 activities per page)"
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  group: garmin-history-import
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: pip install garmin-connect-personal-api-python

      - name: Import Garmin history
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GOOGLE_SYNC_TOKEN: ${{ secrets.GOOGLE_SYNC_TOKEN }}
          START_OFFSET: ${{ inputs.start_offset }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          PAGE_SIZE = 100
          UPLOAD_BATCH = 25

          def number(value, divisor=1):
              if value is None:
                  return None
              return round(float(value) / divisor, 3)

          def sport_name(value):
              if isinstance(value, dict):
                  return (
                      value.get("typeKey")
                      or value.get("typeId")
                      or "unknown"
                  )
              return str(value or "unknown")

          def convert(a):
              activity_id = a.get("activityId")

              if activity_id is None:
                  return None

              distance = a.get("distance")
              duration = a.get("duration")
              speed = a.get("averageSpeed")

              pace = None
              if distance and duration:
                  pace = round(
                      float(duration) /
                      (float(distance) / 1000),
                      1
                  )

              return {
                  "activity_id": str(activity_id),
                  "date": a.get("startTimeLocal"),
                  "sport": sport_name(
                      a.get("activityType")
                  ),
                  "name": a.get("activityName"),
                  "duration_sec": number(duration),
                  "distance_km": number(
                      distance, 1000
                  ),
                  "pace_sec_km": pace,
                  "speed_kmh": number(
                      speed, 1 / 3.6
                  ),
                  "avg_hr": a.get("averageHR"),
                  "max_hr": a.get("maxHR"),
                  "avg_power": a.get("avgPower"),
                  "np": a.get("normPower"),
                  "cadence": (
                      a.get(
                          "averageRunningCadenceInStepsPerMinute"
                      )
                      or a.get(
                          "averageBikingCadenceInRevPerMinute"
                      )
                      or a.get(
                          "averageSwimCadenceInStrokesPerMinute"
                      )
                  ),
                  "elevation_m": a.get(
                      "elevationGain"
                  ),
                  "calories": a.get("calories"),
                  "aerobic_te": a.get(
                      "aerobicTrainingEffect"
                  ),
                  "anaerobic_te": a.get(
                      "anaerobicTrainingEffect"
                  ),
                  "training_load": a.get(
                      "activityTrainingLoad"
                  ),
                  "url": (
                      "https://connect.garmin.com/"
                      "modern/activity/"
                      + str(activity_id)
                  )
              }

          def upload(batch):
              payload = json.dumps({
                  "token": os.environ[
                      "GOOGLE_SYNC_TOKEN"
                  ],
                  "activities": batch
              }).encode("utf-8")

              request = urllib.request.Request(
                  os.environ["GOOGLE_SCRIPT_URL"],
                  data=payload,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request, timeout=90
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if data.get("ok") is not True:
                  raise RuntimeError(
                      "Google Sheets sync failed: "
                      + str(data.get("error"))
                  )

              return data.get("added", 0)

          offset = int(
              os.environ["START_OFFSET"]
          )
          max_pages = int(
              os.environ["MAX_PAGES"]
          )

          if offset < 0:
              raise ValueError(
                  "start_offset must be >= 0"
              )

          if not 1 <= max_pages <= 20:
              raise ValueError(
                  "max_pages must be 1..20"
              )

          total_fetched = 0
          total_added = 0

          for page_number in range(max_pages):
              print(
                  f"Fetching Garmin activities "
                  f"at offset {offset}",
                  flush=True
              )

              result = subprocess.run(
                  [
                      "gc-personal",
                      "--quiet",
                      "activities",
                      "--start",
                      str(offset),
                      "--limit",
                      str(PAGE_SIZE)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              raw = json.loads(result.stdout)

              if not isinstance(raw, list):
                  raise RuntimeError(
                      "Unexpected Garmin response"
                  )

              if not raw:
                  print(
                      "No more Garmin activities."
                  )
                  break

              activities = [
                  converted
                  for a in raw
                  if (converted := convert(a))
                  is not None
              ]

              for i in range(
                  0,
                  len(activities),
                  UPLOAD_BATCH
              ):
                  batch = activities[
                      i:i + UPLOAD_BATCH
                  ]

                  added = upload(batch)
                  total_added += added

                  print(
                      f"Batch: {len(batch)} "
                      f"activities, added: {added}",
                      flush=True
                  )

              total_fetched += len(raw)
              offset += len(raw)

              print(
                  f"PROGRESS: fetched="
                  f"{total_fetched}, "
                  f"added={total_added}, "
                  f"next_offset={offset}",
                  flush=True
              )

              if len(raw) < PAGE_SIZE:
                  print(
                      "Reached end of Garmin history."
                  )
                  break

              time.sleep(2)

          print("IMPORT FINISHED")
          print(
              "Total fetched:", total_fetched
          )
          print(
              "Total added:", total_added
          )
          print(
              "NEXT_OFFSET:", offset
          )
          PY
