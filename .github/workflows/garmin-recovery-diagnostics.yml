name: Inspect Garmin recovery commands
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Garmin client
        run: pip install garmin-connect-personal-api-python
      - name: Inspect recovery command arguments
        run: |
          for command in sleep-summaries hrv-summaries daily-summaries body-battery stress weight-measurements; do
            echo "::group::$command"
            gc-personal "$command" --help
            echo "::endgroup::"
          done
